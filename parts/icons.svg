  <rect class="k" x="24.5" y="5" width="9" height="28" rx="4.5" fill="#ffd877"/>
  <rect class="k" x="34" y="7" width="9" height="26" rx="4.5" fill="#f6c14f"/>
  <rect class="k" x="43" y="13" width="8" height="21" rx="4" fill="#f0a92e"/>
  <rect class="k" x="5" y="27" width="17" height="10" rx="5" fill="#f6c14f" transform="rotate(-28 13 32)"/>
  <path class="k" d="M14 30h37v8c0 8-6 13-14 13h-9c-8 0-14-5-14-13z" fill="#f0a92e"/>
  <path d="M17 32h20v6c0 5-3 9-8 9h-3c-5 0-9-4-9-9z" fill="#ffd877"/>
  <rect class="k" x="16" y="49" width="32" height="10" rx="3" fill="#3d93f0"/>
