<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
<!-- Cuci Penapis icon set. LihFolk "glossy" recipe: thick ink outline, light and shade facet,
     white specular streak and a tip glint, light from the top left. Ink is Fixers #191a18. -->
<defs>
  <style>.k{stroke:#191a18;stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round}.s{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;opacity:.9}.g{fill:#fff}</style>
</defs>

<!-- work glove -->
<symbol id="ic-hand" viewBox="0 0 64 64">
