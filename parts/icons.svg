  <rect class="k" x="5" y="17" width="54" height="38" rx="9" fill="#3a3f47"/>
  <rect x="8" y="20" width="48" height="13" rx="6" fill="#5a616b"/>
  <rect class="k" x="45" y="22" width="9" height="6" rx="2" fill="#fff3b0"/>
  <circle class="k" cx="31" cy="36" r="14" fill="#2a2e34"/>
